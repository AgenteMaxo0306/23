<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realidad Aumentada 3D</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    #cubo {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 130px;
      height: 130px;
      transform: translate(-50%, -50%);
      display: none;
      perspective: 600px;
    }
    .cubo3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: giro 5s linear infinite;
    }
    .cara {
      position: absolute;
      width: 130px;
      height: 130px;
      border: 2px solid white;
      background: #168cffcc;
      box-sizing: border-box;
    }
    #objeto3d {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 90vw;
  max-width: 600px;
  height: auto;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 25px #008cff);
  animation: flotar 4s ease-in-out infinite;
  display: none;
  z-index: 2;
}

@keyframes flotar {
  0%, 100% {
    transform: translate(-50%, -50%) perspective(900px) rotateY(-4deg);
  }

  50% {
    transform: translate(-50%, -53%) perspective(900px) rotateY(4deg);
  }
}
    .frente  { transform: translateZ(65px); }
    .atras   { transform: rotateY(180deg) translateZ(65px); }
    .derecha { transform: rotateY(90deg) translateZ(65px); }
    .izquierda { transform: rotateY(-90deg) translateZ(65px); }
    .arriba  { transform: rotateX(90deg) translateZ(65px); }
    .abajo   { transform: rotateX(-90deg) translateZ(65px); }

    @keyframes giro {
      from { transform: rotateX(-20deg) rotateY(0deg); }
      to { transform: rotateX(340deg) rotateY(360deg); }
    }
    #inicio {
      position: relative;
      z-index: 2;
      padding: 30px 15px;
    }
    button {
      padding: 15px 22px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      background: #55e6c1;
      margin: 10px;
    }
    #estado {
      position: fixed;
      z-index: 3;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-shadow: 1px 1px 4px black;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>

  <div id="cubo">
    <div class="cubo3d">
      <div class="cara frente"></div>
      <div class="cara atras"></div>
      <div class="cara derecha"></div>
      <div class="cara izquierda"></div>
      <div class="cara arriba"></div>
      <div class="cara abajo"></div>
    </div>
  </div>

  <div id="inicio">
    <h1>Mi objeto 3D</h1>
    <p>Activá la cámara para ver el objeto flotando.</p>
    <button id="abrir">ABRIR CÁMARA Y 3D</button>
    <p id="error"></p>
  </div>

  <div id="estado"></div>

  <script>
    const video = document.getElementById("video");
    const cubo = document.getElementById("cubo");
    const inicio = document.getElementById("inicio");
    const error = document.getElementById("error");
    const estado = document.getElementById("estado");
    let flujo;

    document.getElementById("abrir").onclick = async () => {
      error.textContent = "Solicitando permiso de cámara...";

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Abrí la página con una dirección HTTPS.");
        }

        flujo = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: "environment" } }
        });

        video.srcObject = flujo;
        await video.play();

        video.style.display = "block";
        document.getElementById("objeto3d").style.display = "block";
        inicio.style.display = "none";
        estado.textContent = "Objeto 3D activo";

      } catch (e) {
        error.textContent = "No se pudo abrir la cámara: " + e.message;
      }
      
    };
  </script>
</body>
</html>
