<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Data y Realidad Aumentada</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 35px 15px 20px;
    }

    h1 {
      font-size: clamp(30px, 7vw, 48px);
      margin-bottom: 20px;
    }

    header p {
      font-size: 18px;
      line-height: 1.5;
      color: #dddddd;
    }

    button {
      background: #50dfbd;
      color: #071a16;
      border: none;
      border-radius: 18px;
      padding: 20px 28px;
      margin: 15px auto;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #error {
      color: #ff8585;
      padding: 0 20px;
      overflow-wrap: anywhere;
    }

    #estado {
      color: #50dfbd;
      padding: 0 20px;
    }

    #visor {
      display: none;
      position: relative;
      width: 100%;
      height: 65vh;
      min-height: 350px;
      max-height: 700px;
      overflow: hidden;
      background: #000;
      margin-top: 15px;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #objeto3d {
      display: none;
      position: absolute;
      width: min(82%, 450px);
      max-height: 75%;
      object-fit: contain;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 18px #42e8cb);
      animation: flotar 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes flotar {
      0%, 100% {
        transform: translate(-50%, -50%);
      }
      50% {
        transform: translate(-50%, calc(-50% - 15px));
      }
    }

    .nota {
      padding: 15px 20px 30px;
      color: #bbbbbb;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Big Data y Realidad Aumentada</h1>
    <p>
      Activá la cámara para visualizar un objeto digital
      superpuesto al entorno real.
    </p>

    <button id="botonAbrir" type="button">
      ABRIR CÁMARA Y 3D
    </button>

    <p id="estado" role="status"></p>
    <p id="error" role="alert"></p>
  </header>

  <main>
    <div id="visor">
      <video id="video" autoplay muted playsinline></video>

      <!-- La imagen debe estar guardada con este nombre -->
      <img
        id="objeto3d"
        src="bigdata.png"
        alt="Modelo visual de Big Data y realidad aumentada"
      >
    </div>

    <button id="botonCerrar" type="button" hidden>
      CERRAR CÁMARA
    </button>

    <p class="nota">
      Para utilizar la cámara, abrí esta página mediante HTTPS
      y aceptá el permiso cuando el navegador lo solicite.
    </p>
  </main>

  <script>
    const botonAbrir = document.getElementById("botonAbrir");
    const botonCerrar = document.getElementById("botonCerrar");
    const video = document.getElementById("video");
    const objeto3d = document.getElementById("objeto3d");
    const visor = document.getElementById("visor");
    const estado = document.getElementById("estado");
    const error = document.getElementById("error");

    let flujoCamara = null;
    let iniciando = false;

    async function abrirCamara() {
      if (iniciando) return;
      iniciando = true;

      botonAbrir.disabled = true;
      error.textContent = "";
      estado.textContent = "Solicitando acceso a la cámara...";

      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "La cámara no está disponible. Abrí la página con HTTPS en Chrome o Safari."
          );
        }

        // Evita mantener una cámara anterior activa.
        if (flujoCamara) {
          flujoCamara.getTracks().forEach(track => track.stop());
          flujoCamara = null;
        }

        video.pause();
        video.srcObject = null;

        const nuevoFlujo =
          await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });

        flujoCamara = nuevoFlujo;
        video.srcObject = nuevoFlujo;

        // Espera a que el video esté listo antes de reproducirlo.
        await new Promise((resolve, reject) => {
          if (video.readyState >= 1) {
            resolve();
            return;
          }

          const alCargar = () => {
            limpiar();
            resolve();
          };

          const alFallar = () => {
            limpiar();
            reject(new Error("No se pudo preparar el video de la cámara."));
          };

          function limpiar() {
            video.removeEventListener("loadedmetadata", alCargar);
            video.removeEventListener("error", alFallar);
          }

          video.addEventListener("loadedmetadata", alCargar, { once: true });
          video.addEventListener("error", alFallar, { once: true });
        });

        // Se ejecuta una sola vez por cada inicio de cámara.
        await video.play();

        visor.style.display = "block";
        objeto3d.style.display = "block";
        botonCerrar.hidden = false;
        estado.textContent = "Cámara activa. Objeto visualizado.";

        if (!objeto3d.complete || objeto3d.naturalWidth === 0) {
          error.textContent =
            "La cámara funciona, pero no se encontró bigdata.png. Revisá el nombre y la ubicación de la imagen.";
        }

      } catch (e) {
        console.error("Error de cámara:", e.name, e.message);

        if (flujoCamara) {
          flujoCamara.getTracks().forEach(track => track.stop());
          flujoCamara = null;
        }

        video.pause();
        video.srcObject = null;
        visor.style.display = "none";
        objeto3d.style.display = "none";
        estado.textContent = "";

        if (e.name === "NotAllowedError" ||
            e.name === "PermissionDeniedError") {
          error.textContent =
            "Permiso denegado. Habilitá la cámara para este sitio desde los ajustes del navegador.";
        } else if (e.name === "NotFoundError") {
          error.textContent =
            "No se encontró una cámara disponible.";
        } else if (e.name === "NotReadableError") {
          error.textContent =
            "La cámara está ocupada. Cerrá otras aplicaciones que la estén usando.";
        } else if (e.name === "AbortError") {
          error.textContent =
            "Se interrumpió el inicio de la cámara. Cerrala, recargá la página e intentá otra vez.";
        } else {
          error.textContent =
            "No se pudo abrir la cámara: " + e.message;
        }

      } finally {
        iniciando = false;
        botonAbrir.disabled = false;
      }
    }

    function cerrarCamara() {
      if (flujoCamara) {
        flujoCamara.getTracks().forEach(track => track.stop());
        flujoCamara = null;
      }

      video.pause();
      video.srcObject = null;
      visor.style.display = "none";
      objeto3d.style.display = "none";
      botonCerrar.hidden = true;
      estado.textContent = "Cámara cerrada.";
      error.textContent = "";
    }

    botonAbrir.addEventListener("click", abrirCamara);
    botonCerrar.addEventListener("click", cerrarCamara);

    // Avisa si la imagen no se encuentra.
    objeto3d.addEventListener("error", () => {
      error.textContent =
        "No se pudo cargar bigdata.png. Comprobá que esté subida a GitHub.";
    });
  </script>
</body>
</html>
